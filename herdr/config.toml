onboarding = false
[update]
channel = "stable"
version_check = true
manifest_check = true

[worktrees]
directory = "~/datahub/repos/worktrees/"

[ui.toast]
delivery = "system"
delay_seconds = 5


[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[experimental]
switch_ascii_input_source_in_prefix = true

pane_history = false
[theme]
name = "catppuccin"
auto_switch = false

# Custom Keybindings
[keys]
close_workspace = "prefix+shift+d"

# Worktrunk plugin key bindings
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+option+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[ui.sound]
enabled = true

# Change repo: fzf popup to focus/create a workspace for a repo under ~/datahub/repos
[[keys.command]]
key = "prefix+,"
type = "popup"
command = "~/.config/herdr/scripts/change-repo.sh"
description = "Change repo"
width = "60%"
height = "60%"

# herdr-plus quick actions menu
[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"
