# yaml-language-server: $schema=https://gh-dash.dev/schema.json
prSections:
    - title: My Open Pull Requests
      filters: is:open author:@me sort:updated
    - title: Approved PRs to merge
      filters: is:open author:@me review:approved sort:updated
    - title: Needs My Direct Review
      filters: is:open user-review-requested:@me sort:updated
    - title: My Checks failing
      filters: author:@me is:open status:failure sort:updated
    - title: Needs My Team Review
      filters: is:open team-review-requested:acryldata/platform sort:updated
    - title: Involved
      filters: is:open involves:@me -author:@me sort:updated
# issuesSections:
#     - title: My Issues
#       filters: is:open author:@me
#     - title: Assigned
#       filters: is:open assignee:@me
#     - title: Involved
#       filters: is:open involves:@me -author:@me
notificationsSections:
    - title: Review Requested
      filters: reason:review-requested
    - title: Created
      filters: reason:author
    - title: All
      filters: ""
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: false
        width: 0.45
    prsLimit: 10
    prApproveComment: LGTM
    issuesLimit: 1
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            state:
              width: 40
            title:
              width: 10
              grow: true
            updatedAt:
                width: 15
            createdAt:
                width: 15
            repo:
                width: 15
            author:
                width: 15
            authorIcon:
                width: 15
                hidden: false
            assignees:
                width: 10
                hidden: true
            base:
                width: 15
                hidden: false
            lines:
                width: 10
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings:
  prs:
    - key: T
      command: gh enhance -R {{.RepoName}} {{.PrNumber}}
repoPaths:
  acryldata: ~/datahub/repos/acryldata/*
  datahub-project: ~/datahub/repos/datahub-project/
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
pager:
    diff: "diffnav --side-by-side"
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: false
