worktree-path = "~/datahub/repos/worktrees/{{ repo }}/{{ branch | sanitize }}"

[list]
summary = false

[commit]
stage = "tracked"

[post-create]
copy-mise = "DEST=$(pwd) && cd {{ primary_worktree_path }} && { git ls-files --others --ignored --exclude-standard; git ls-files; } 2>/dev/null | grep -E '(^|/)\\.mise\\.local\\.toml$' | sort -u | while IFS= read -r f; do mkdir -p \"$DEST/$(dirname \"$f\")\"; cp -p \"$f\" \"$DEST/$f\"; done || true"
copy-netrc = "[ -f {{ primary_worktree_path }}/docker/snippets/uv/.netrc ] && cp -p {{ primary_worktree_path }}/docker/snippets/uv/.netrc docker/snippets/uv/.netrc || true"
copy-vscode = "[ -d {{ primary_worktree_path }}/.vscode ] && cp -r {{ primary_worktree_path }}/.vscode .vscode || true"
copy-claude = "[ -d {{ primary_worktree_path }}/.claude ] && cp -rn {{ primary_worktree_path }}/.claude/. .claude/ || true"
mise-trust = "if [ -f mise.toml ] || [ -f .tool-versions ] || [ -f .mise.local.toml ]; then mise trust; fi"

[pre-remove]
save-plans = "[ -d .claude/plans ] && { mkdir -p {{ primary_worktree_path }}/.claude/plans && cp -rn .claude/plans/. {{ primary_worktree_path }}/.claude/plans/; } || true"
